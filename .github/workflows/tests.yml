name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  docker:
    # Builds the image and proves it works: non-root user, health check, a real
    # request, and data surviving a container restart on the named volume.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t app:ci .
      - name: Start container with a volume
        run: docker run -d --name app -p 127.0.0.1:8000:8000 -v app-data:/data app:ci
      - name: Wait until healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' app | grep -qx healthy || (docker logs app; exit 1)
      - name: Runs as a non-root user
        run: test "$(docker exec app id -u)" != "0"
      - name: Create data through the API
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/api/subjects -H 'Content-Type: application/json' \
            -d '{"name": "Docker test subject"}'
      - name: Data survives a restart
        run: |
          docker restart app
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health > /dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/subjects | grep -q 'Docker test subject'
      - name: Report image size
        run: docker image ls app:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
